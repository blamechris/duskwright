<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Open shadow roots</title>
<style>body{background:#fff;color:#111;font:16px system-ui;margin:0;padding:24px}</style></head>
<body>
<h1>Open shadow DOM</h1><x-card></x-card><x-card></x-card><div id='nested'></div>
<script>
class XCard extends HTMLElement {
  connectedCallback() {
    const r = this.attachShadow({mode: 'open'});
    const s = new CSSStyleSheet();
    s.replaceSync(':host{display:block;background:#f7f7f7;border:1px solid #ccc;padding:12px;margin:8px 0}p{color:#333}');
    r.adoptedStyleSheets = [s];
    r.innerHTML = '<p>Content inside an open shadow root.</p>';
  }
}
customElements.define('x-card', XCard);
// Nested: a shadow root inside a shadow root.
const outer = document.getElementById('nested').attachShadow({mode: 'open'});
outer.innerHTML = '<div id="inner"></div>';
const inner = outer.getElementById('inner').attachShadow({mode: 'open'});
inner.innerHTML = '<p style="background:#fff;color:#000;padding:8px">Two levels deep.</p>';
</script>
</body>
</html>
