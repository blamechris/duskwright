<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Styles injected after load</title>
<style>body{background:#fff;color:#111;font:16px system-ui;margin:0;padding:24px}</style></head>
<body>
<h1>Late style injection</h1><p>A stylesheet arrives 800ms after load, and another element is added at 1600ms. The engine must catch both without a visible flash of unthemed content.</p><div id='late'></div>
<script>
setTimeout(() => {
  const s = document.createElement('style');
  s.textContent = '.late-block{background:#fff;color:#111;border:2px solid #c00;padding:14px}';
  document.head.appendChild(s);
  const d = document.createElement('div');
  d.className = 'late-block'; d.textContent = 'Styled by a late-arriving stylesheet.';
  document.getElementById('late').appendChild(d);
}, 800);
setTimeout(() => {
  const d = document.createElement('div');
  d.setAttribute('style', 'background:#fff;color:#000;padding:14px;margin-top:8px');
  d.textContent = 'Added even later, with a page-authored inline style.';
  document.getElementById('late').appendChild(d);
}, 1600);
</script>
</body>
</html>
