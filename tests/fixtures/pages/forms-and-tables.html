<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Forms, tables, and controls</title>
<style>body{background:#fff;color:#111;font:16px system-ui;margin:0;padding:24px}table{border-collapse:collapse;margin:12px 0}th,td{border:1px solid #ccc;padding:6px 10px}th{background:#f0f0f0}fieldset{margin:12px 0}</style></head>
<body>
<h1>Native controls</h1><p>Form controls have UA-provided styling that behaves differently from authored CSS; tables carry nested background inheritance.</p><form><fieldset><legend>Controls</legend><input type='text' value='text input'> <input type='checkbox' checked> <select><option>Option A</option><option>Option B</option></select> <textarea rows='2'>textarea</textarea> <button type='button'>Button</button><input type='range'> <progress value='0.6'></progress></fieldset></form><table><thead><tr><th>Name</th><th>Value</th></tr></thead><tbody><tr><td>Alpha</td><td style='background:#ffe'>1,000</td></tr><tr><td>Beta</td><td>2,000</td></tr></tbody></table>

</body>
</html>
