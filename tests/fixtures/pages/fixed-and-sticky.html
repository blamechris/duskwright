<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixed, sticky, and layered elements</title>
<style>body{background:#fff;color:#111;font:16px system-ui;margin:0;padding:24px}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ccc;padding:10px}.fab{position:fixed;right:20px;bottom:20px;background:#0645ad;color:#fff;padding:12px 16px;border-radius:24px}.modal{position:fixed;inset:20% 25%;background:#fff;border:1px solid #999;padding:20px;box-shadow:0 8px 40px rgba(0,0,0,.3)}.tall{height:1400px;background:linear-gradient(#fff,#eee)}</style></head>
<body>
<header>Sticky header</header><h1>Layered elements</h1><p>Overlay surfaces are where coverage sampling most often miscounts painted area.</p><div class='modal'>A modal dialog over the page.</div><div class='fab'>Action</div><div class='tall'></div>

</body>
</html>
