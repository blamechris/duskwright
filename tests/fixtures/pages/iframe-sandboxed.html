<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Sandboxed iframe</title>
<style>body{background:#fff;color:#111;font:16px system-ui;margin:0;padding:24px}iframe{width:100%;height:200px;border:1px solid #ccc}</style></head>
<body>
<h1>Sandboxed iframe</h1><p>A sandboxed frame may refuse injection entirely (§1 cause 3). The correct behaviour is to report it once, not retry in a loop.</p><iframe sandbox='allow-same-origin' srcdoc="<style>body{background:#fff;color:#111;font:14px system-ui}</style><p>Sandboxed frame content.</p>"></iframe>

</body>
</html>
