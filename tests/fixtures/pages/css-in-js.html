<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>CSS-in-JS with hashed class names</title>
<style>body{background:#fff;color:#111;font:16px system-ui;margin:0;padding:24px}</style></head>
<body>
<h1>CSS-in-JS</h1><p>Rules are inserted through the CSSOM at runtime with hash-generated class names (§1 cause 7). The selector generator must reject these classes as unstable anchors.</p><div id='out'></div>
<script>
// Emulates styled-components / emotion: a constructed sheet, rules added via insertRule,
// class names that change on every build.
const style = document.createElement('style');
document.head.appendChild(style);
const sheet = style.sheet;
const hashes = ['css-1a2b3c', 'sc-bdVaJa', '_1x2y3z', 'css-9f8e7d', 'emotion-4k2j1h'];
const out = document.getElementById('out');
hashes.forEach((h, i) => {
  sheet.insertRule(`.${h}{background:hsl(${i * 60} 60% 94%);color:#222;padding:10px;margin:6px 0}`, sheet.cssRules.length);
  const d = document.createElement('div');
  d.className = h;
  d.textContent = `Styled by .${h} — a hash, not a stable anchor`;
  out.appendChild(d);
});
// Late-arriving rules, after first paint.
setTimeout(() => sheet.insertRule('.css-late99{outline:2px solid #999}', sheet.cssRules.length), 400);
</script>
</body>
</html>
