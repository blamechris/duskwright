name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Repo hygiene. Runs from day one, before any source exists.
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing. The default depth-1 checkout leaves the base ref
      # unresolvable, so the commit-trailer scan below cannot see the PR's history at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Required files are present
        run: |
          missing=0
          for f in LICENSE NOTICE README.md CLAUDE.md ARCHITECTURE.md; do
            if [ ! -f "$f" ]; then echo "::error::missing required file: $f"; missing=1; fi
          done
          exit $missing

      - name: Upstream attribution is retained
        run: |
          grep -q "Dark Reader Ltd." LICENSE || {
            echo "::error::LICENSE must retain upstream's copyright (MIT fork requirement)"; exit 1; }
          grep -q "darkreader/darkreader" README.md || {
            echo "::error::README must state plainly that this is a fork and link upstream"; exit 1; }

      - name: No literal control bytes in source
        run: |
          # A literal NUL byte reached main in src/purity/inline/. It is invisible in review,
          # breaks grep and string-matching editors, and a reviewer who flagged it was told it
          # was a false positive — because the check used to refute them was `grep -P '\x00'`,
          # which cannot find NUL at all. grep is line-oriented and NUL-delimited, so it exits
          # "no match" on a file that plainly contains one.
          #
          # Hence Python reading bytes: the check has to be able to see what it looks for.
          python3 - <<'PY'
          import pathlib, subprocess, sys
          TEXT = {'.ts', '.tsx', '.js', '.mjs', '.cjs', '.json', '.md', '.yml', '.yaml',
                  '.html', '.css', '.less', '.config', '.sh'}
          files = subprocess.run(['git', 'ls-files'], capture_output=True, text=True).stdout.split()
          bad = []
          for f in files:
              p = pathlib.Path(f)
              if p.suffix not in TEXT:
                  continue
              try:
                  data = p.read_bytes()
              except OSError:
                  continue
              for n, line in enumerate(data.split(b'\n'), 1):
                  if b'\x00' in line:
                      bad.append(f'{f}:{n}')
          if bad:
              print('::error::literal NUL byte in source (write it as \\u0000 instead):')
              for b in bad:
                  print(f'  {b}')
              sys.exit(1)
          print(f'no literal control bytes across {len(files)} tracked files')
          PY

      - name: No AI or agent attribution
        run: |
          # Match attribution as it actually appears — a trailer or footer at the start of a
          # line — not prose that merely names it. The installed skills legitimately contain
          # sentences forbidding "Co-Authored-By: Claude", and those must not trip this gate.
          AGENTS='claude|anthropic|copilot|codex|chatgpt|gpt-[0-9]|gemini|cursor|devin|aider'
          if grep -rniE "^[[:space:]]*(co-authored-by:[[:space:]]*($AGENTS)|(:robot:|🤖)?[[:space:]]*generated (with|by) \[?($AGENTS))" \
               --include="*.md" --include="*.yml" --include="*.ts" --include="*.js" \
               --exclude-dir=.git --exclude-dir=.claude --exclude-dir=.codex --exclude-dir=.gemini .; then
            echo "::error::attribution footer found in tracked content — see CLAUDE.md"; exit 1
          fi

      - name: No attribution trailers in commits
        run: |
          # The place a Co-Authored-By trailer actually lands. The policy bans the trailer
          # outright — no Claude, no other agent, no human co-author — so this matches any
          # Co-Authored-By, not a name list.
          #
          # This step runs on BOTH triggers. It used to be pull_request-only, which meant it
          # went silent on push-to-main — the exact moment code lands, and the moment a
          # GitHub-generated squash-merge commit can carry Co-authored-by trailers harvested
          # from the branch. A gate that skips the event it exists to guard is not a gate.
          set -euo pipefail

          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --quiet origin "${{ github.base_ref }}"
            # Scan the PR branch tip, NOT HEAD. On a pull_request event actions/checkout
            # checks out GitHub's synthetic merge commit, whose FIRST parent is the base
            # branch — so --first-parent from HEAD walks the base side and inspects none of
            # our commits. It reported "scanning 1 commit" and passed while examining nothing.
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            # push: scan what this push actually added. `before` is all-zeroes for a new
            # branch or a force-push, in which case fall back to the tip commit alone.
            BASE="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              BASE="$HEAD_SHA~1"
              git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE="$HEAD_SHA"
            fi
          fi

          if ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            echo "::error::$HEAD_SHA is not present locally — nothing was scanned"; exit 1
          fi

          # Resolve the range explicitly and FAIL if we cannot. Piping git straight into
          # grep hides git's own failure: the pipeline takes grep's status, "no match" is
          # exit 1, and the `if` reads that as clean. A gate that cannot fail is not a gate.
          if [ "$BASE" = "$HEAD_SHA" ]; then
            MERGE_BASE="$HEAD_SHA~1"
            git cat-file -e "$MERGE_BASE^{commit}" 2>/dev/null || MERGE_BASE=""
          elif ! MERGE_BASE=$(git merge-base "$BASE" "$HEAD_SHA" 2>/dev/null); then
            echo "::error::cannot resolve $BASE — the commit range was not scanned. \
          This check must not pass without inspecting history (is fetch-depth 0?)."
            exit 1
          fi

          # Root commit: no range to walk, so scan the single commit's own message.
          if [ -z "$MERGE_BASE" ]; then
            echo "scanning the root commit $HEAD_SHA"
            if git log -1 "$HEAD_SHA" --format='%B' | grep -niE '^[[:space:]]*co-authored-by:'; then
              echo "::error::Co-Authored-By trailer found — see CLAUDE.md"; exit 1
            fi
            echo "no attribution trailers found"; exit 0
          fi

          # --first-parent follows only our own mainline. A vendor merge (the E1 fork ingest
          # brought in 10,159 upstream commits) appears as a single commit rather than its
          # whole history, so we scan what WE authored. Upstream's contributors legitimately
          # use Co-authored-by trailers; the policy governs our commits, and rewriting an
          # imported history to satisfy it would be both absurd and dishonest.
          COMMITS=$(git rev-list --count --first-parent "$MERGE_BASE..$HEAD_SHA")
          echo "scanning $COMMITS first-parent commit(s) from $MERGE_BASE to $HEAD_SHA"
          git log --first-parent --oneline "$MERGE_BASE..$HEAD_SHA" | sed 's/^/  /'
          if [ "$COMMITS" -eq 0 ]; then
            echo "::error::resolved an empty commit range — refusing to report clean"; exit 1
          fi

          TRAILERS=$(git log --first-parent "$MERGE_BASE..$HEAD_SHA" --format='%B' \
                       | grep -niE '^[[:space:]]*co-authored-by:' || true)
          if [ -n "$TRAILERS" ]; then
            echo "$TRAILERS"
            echo "::error::Co-Authored-By trailer found in a commit message — see CLAUDE.md"
            exit 1
          fi
          echo "no attribution trailers found"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: |
          if [ -f package.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::no package.json yet (pre-E1) — skipping"; fi
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - if: steps.check.outputs.ready == 'true'
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: |
          if [ -f package.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::no package.json yet (pre-E1) — skipping"; fi
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - if: steps.check.outputs.ready == 'true'
        run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: |
          if [ -f package.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::no package.json yet (pre-E1) — skipping"; fi
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - if: steps.check.outputs.ready == 'true'
        run: npm test

  # Advisory for now — deliberately NOT a required check until the suite exists (E2+).
  # Present so the `npm run test:e2e` documented in CLAUDE.md and README has a CI home
  # rather than drifting into a command nothing ever runs.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: |
          if [ -d tests/e2e ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::e2e suite lands with E2+ — skipping"; fi
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - if: steps.check.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.check.outputs.ready == 'true'
        run: npm run test:e2e

  # THE BLOCKING GATE. See CLAUDE.md and docs/adr/0001.
  # Never add exclusions here to make a PR pass. If it is red, the code is wrong.
  purity:
    name: purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: |
          set -euo pipefail
          # The self-skip exists only to bridge the pre-E2 window. It must expire on its own,
          # or a deleted/renamed harness reports green forever — the exact "gate that passes on
          # a real violation" failure mode ADR 0001 warns about, applied to the gate itself.
          HAS_SCRIPT=false
          if [ -f package.json ] && node -e \
               'process.exit(require("./package.json").scripts?.["test:purity"] ? 0 : 1)'; then
            HAS_SCRIPT=true
          fi

          if [ -d tests/purity ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_SCRIPT" = true ]; then
            echo "::error::package.json defines test:purity but tests/purity/ is missing. \
          The purity harness has landed, so this job must never self-skip again."
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::purity harness lands in E2 — skipping"
          fi
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - if: steps.check.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      # The harness loads the real extension from build/release/chrome-mv3. Without this it
      # would launch a browser with nothing installed and every assertion would pass
      # trivially — a perfect score from a harness testing nothing.
      - if: steps.check.outputs.ready == 'true'
        run: npm run build
      - if: steps.check.outputs.ready == 'true'
        run: npm run test:purity
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: purity-failures
          path: test-results/
          retention-days: 7
